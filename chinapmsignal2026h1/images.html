<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国PM就业市场全景分析 · 完整报告</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #162447;
  --accent: #b8860b;
  --text: #e0e0e0;
  --muted: #8892b0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #0f1629 0%, #1a2744 100%);
  padding: 40px 20px 32px; text-align: center;
  border-bottom: 2px solid var(--accent);
}
header h1 { font-size: 1.35em; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.3px; }
header p { color: var(--muted); font-size: 0.9em; }
.badge-row { margin-top: 16px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
.badge {
  background: rgba(184,134,11,0.15); border:1px solid rgba(184,134,11,0.3);
  padding: 5px 14px; border-radius: 20px; font-size:0.8em; color:var(--accent);
}
main { max-width: 750px; margin:0 auto; padding: 16px 12px 48px; }
.slide-card {
  background: var(--card); border-radius: 8px; overflow: hidden;
  margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}
.slide-label {
  padding: 10px 16px; background: rgba(0,0,0,0.25);
  font-size: 0.82em; color: var(--accent); font-weight: 600;
}
.slide-card img { width:100%; display: block; }
.tip {
  text-align:center; padding: 20px 24px; margin: 8px 0 20px;
  background: rgba(184,134,11,0.08); border-radius: 8px;
  border: 1px solid rgba(184,134,11,0.2);
}
.tip p { font-size:0.85em; color:var(--muted); line-height:1.7; }
footer { text-align:center; padding:24px 16px 48px; color:var(--muted); font-size:0.78em; line-height:1.9; }
footer a { color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>

<header>
  <h1>2026 中国科技行业<br>产品经理岗位全景分析</h1>
  <p>基于228家公司官方招聘数据 · 9页完整报告</p>
  <div class="badge-row">
    <span class="badge">228家公司</span>
    <span class="badge">15个赛道</span>
    <span class="badge">1,200+ 岗位</span>
  </div>
</header>

<main>
  <div class="tip">
    <p>💡 手机端已优化 — 逐张长按保存，或直接截图分享</p>
  </div>

  <div class="slide-card">
    <div class="slide-label">第 1 页 · 封面</div>
    <img src="slides/00_00_封面.png" alt="封面" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 2 页 · 执行摘要</div>
    <img src="slides/01_01_执行摘要.png" alt="执行摘要" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 3 页 · 覆盖公司概览</div>
    <img src="slides/02_02_覆盖公司概览.png" alt="公司概览" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 4 页 · 岗位模块分布</div>
    <img src="slides/03_03_岗位模块分布.png" alt="模块分布" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 5 页 · 分赛道核心发现</div>
    <img src="slides/04_04_分赛道核心发现.png" alt="分赛道发现" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 6 页 · 技能频次分析</div>
    <img src="slides/05_05_技能频次分析.png" alt="技能分析" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 7 页 · 核心发现与趋势</div>
    <img src="slides/06_06_核心发现与趋势.png" alt="核心发现" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 8 页 · 警示信号</div>
    <img src="slides/07_07_警示信号.png" alt="警示信号" loading="lazy" width="750">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 9 页 · 数据采集方法</div>
    <img src="slides/08_08_方法说明.png" alt="方法说明" loading="lazy" width="750">
  </div>
</main>

<footer>
  <p>完整交互版报告：<a href="/chinapmsignal2026h1/">dendendamen.cn/chinapmsignal2026h1/</a></p>
  <p>版权归作者所有 · 数据仅供行业趋势参考</p>
</footer>

</body>
</html>
