<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026中国PM就业市场全景分析 — 完整报告图片版</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #162447;
  --accent: #b8860b;
  --text: #e0e0e0;
  --muted: #8892b0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #0f1629 0%, #1a2744 100%);
  padding: 48px 24px 40px; text-align: center;
  border-bottom: 2px solid var(--accent);
}
header h1 { font-size: 1.6em; font-weight: 700; margin-bottom: 8px; }
header p { color: var(--muted); font-size: 0.95em; }
.badge-row { margin-top: 20px; display:flex; justify-content:center; gap:24px; flex-wrap:wrap; }
.badge {
  background: rgba(184,134,11,0.15); border:1px solid rgba(184,134,11,0.3);
  padding: 6px 18px; border-radius: 20px; font-size:0.85em; color:var(--accent);
}
main { max-width: 1080px; margin:0 auto; padding: 24px 16px 60px; }
.slide-card {
  background: var(--card); border-radius: 8px; overflow: hidden;
  margin-bottom: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.slide-label {
  padding: 12px 20px; background: rgba(0,0,0,0.2);
  font-size: 0.9em; color: var(--accent); font-weight: 600;
}
.slide-card img { width:100%; display: block; }
.download-btn {
  display: inline-block; margin-top:12px; padding: 8px 20px;
  background: var(--accent); color: #fff; border-radius: 4px;
  text-decoration: none; font-size:0.85em; font-weight:600;
  transition: opacity 0.2s;
}
.download-btn:hover { opacity: 0.85; }
footer { text-align:center; padding:32px 16px 48px; color:var(--muted); font-size:0.82em; }
footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>

<header>
  <h1>2026年中国高薪科技行业<br>产品经理岗位全景分析</h1>
  <p>完整报告 · 图片版 · 共9页</p>
  <div class="badge-row">
    <span class="badge">228家公司</span>
    <span class="badge">15个赛道</span>
    <span class="badge">1,200+岗位</span>
  </div>
</header>

<main>
  <div class="slide-card">
    <div class="slide-label">第 1 页 — 封面</div>
    <img src="slides/00_封面.png" alt="封面" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 2 页 — 覆盖公司概览（228家 / 15个赛道）</div>
    <img src="slides/01_1%20覆盖公司概览（228家%20_%2015个赛道）.png" alt="覆盖公司概览" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 3 页 — 产品经理岗位模块分布与市场热度</div>
    <img src="slides/02_2%20产品经理岗位模块分布与市场热度.png" alt="岗位模块分布" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 4 页 — 分赛道核心发现</div>
    <img src="slides/03_3%20分赛道核心发现.png" alt="分赛道核心发现" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 5 页 — 技能关键词频次分析</div>
    <img src="slides/04_4%20技能关键词频次分析：市场对产品经理的十大核心能力诉求.png" alt="技能关键词分析" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 6 页 — 核心发现与趋势判断</div>
    <img src="slides/05_5%20核心发现与趋势判断.png" alt="核心发现" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 7 页 — 对产品经理从业者的警示信号</div>
    <img src="slides/06_6%20对产品经理从业者的警示信号.png" alt="警示信号" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 8 页 — 数据采集方法说明</div>
    <img src="slides/07_7%20数据采集方法说明.png" alt="方法说明" loading="lazy">
  </div>
  <div class="slide-card">
    <div class="slide-label">第 9 页 — 脚注</div>
    <img src="slides/08_脚注.png" alt="脚注" loading="lazy">
  </div>
</main>

<footer>
  <p>完整交互版报告：<a href="/chinapmsignal2026h1/">dendendamen.cn/chinapmsignal2026h1/</a></p>

</footer>

</body>
</html>
